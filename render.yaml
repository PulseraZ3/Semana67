services:
  - type: web
    name: agente-scooter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: PROVEEDOR
        value: gemini
      - key: MODELO
        value: gemini-3.5-flash-lite
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "FALSE"
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
